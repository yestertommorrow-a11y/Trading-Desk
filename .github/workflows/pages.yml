name: Deploy to GitHub Pages

# Publishes the static dashboard in dist/ to https://yestertommorrow-a11y.github.io/Trading-Desk/.
# The hosted page opens in sample mode; live data needs Start Strikebook.cmd running on the viewer's PC.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue the newest one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish dist/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
